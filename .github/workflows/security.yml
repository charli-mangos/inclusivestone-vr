name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so every commit is scanned
          lfs: false     # binary assets do not need to be downloaded

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          # A licence key is only needed for repositories owned by an
          # organisation. Personal repositories can use the action free.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
